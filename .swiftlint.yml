included:
  - Sources
  - Tests

excluded:
  - .build
  - dist
  - build
  - DerivedData
  - EMLViewer.xcodeproj

disabled_rules:
  - trailing_comma
  - todo
  - multiple_closures_with_trailing_closure
  - for_where
  - large_tuple

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicit_return
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - redundant_nil_coalescing
  - sorted_first_last
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces
  - yoda_condition

line_length:
  warning: 140
  error: 200
  ignores_urls: true
  ignores_comments: true

identifier_name:
  min_length: 1
  excluded: [id, to, cc, v, f, p, a, w]

type_name:
  min_length: 2

file_length:
  warning: 800
  error: 1200

function_body_length:
  warning: 80
  error: 150

cyclomatic_complexity:
  warning: 20
  error: 30

type_body_length:
  warning: 400
  error: 600

function_parameter_count:
  warning: 10
  error: 15

nesting:
  type_level: 3
